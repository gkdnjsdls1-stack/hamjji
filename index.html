/* ---------- 닭갈비 (B계열 · 쫓아다니기) ----------
   한곳에 두면 탑니다. 손가락으로 밀어서 자리를 옮겨야 안 타고 익습니다.
   밀면 그 조각의 '한자리에 있던 시간'만 0으로 돌아가고, 익은 정도는 그대로 쌓입니다. */
let G = null;
/* 여섯 조각이 다 0초에 시작하면 전부 같은 순간에 완성돼서, 6초 내내 여섯 개를 동시에
   돌봐야 했습니다. MEAT_STAGGER 만큼 늦게 시작시켜 완성이 흩어지게 했습니다.
   뒤로 갈수록 남은 조각이 줄어 쉬워집니다. 2학년 손에 맞춰 익는 시간·타는 시간도 늘렸습니다. */
const MEAT_N = 6, MEAT_DONE = TUNE.meatDone, MEAT_BURN = TUNE.meatBurn, MEAT_PAY = 65, MEAT_STAGGER = TUNE.meatStagger;
const MEAT_BURN_MAX = 2;   // 한 조각이 깎이는 횟수 상한. 없으면 한 번 태운 조각은 방치가 이득입니다

function startGrill(){
  G = { pieces:[], done:0, burns:0, last:0, raf:0, w:300, h:200, px:0, py:0, down:false, held:null };
  $('work').hidden = false;
  buildGrill();
  G.last = performance.now();
  G.raf = requestAnimationFrame(grillTick);
}

function buildGrill(){
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = '닭갈비 0 / ' + MEAT_N;
  $('w-earned').textContent = won(0);
  const body = $('w-body');
  body.innerHTML =
    /* 쓸어도 한 조각만 움직이게 바꿨으니, 안내도 그렇게 적어야 합니다.
       전에는 "밀어서"라고 적혀 있어서 철판을 문지르게 만들었고, 그러면 한 조각만
       살아나고 나머지 다섯이 조용히 탑니다. */
    '<p class="hint">조각을 하나씩 집어서 다른 자리로 옮겨 주세요. ' +
    '<b>흔들리는 조각</b>이 곧 타는 거예요.</p>' +
    '<div class="pan" id="pan"><div class="plate"></div></div>' +
    '<div class="tally" id="tally"></div>' +
    '<div class="row"><button class="btn wide quit" id="g-quit">그만하기</button></div>';
  const pan = $('pan');
  G.w = pan.clientWidth || 300;
  G.h = pan.clientHeight || 220;
  for(let i = 0; i < MEAT_N; i++){
    const el = document.createElement('div');
    el.className = 'meat';
    el.innerHTML = art('work/galbi', 50);
    pan.appendChild(el);
    const p = {
      el: el,
      tint: el.querySelector('.art'),
      x: 26 + Math.random() * (G.w - 100),
      y: 26 + Math.random() * (G.h - 100),
      heat: -i * MEAT_STAGGER, cooked: -i * MEAT_STAGGER, burnt: false, burns: 0
    };
    el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    G.pieces.push(p);
  }
  pan.addEventListener('pointerdown', grillDown);
  pan.addEventListener('pointermove', grillMove);
  pan.addEventListener('pointerup', grillUp);
  pan.addEventListener('pointercancel', grillUp);
  drawTally(MEAT_N, G.done, 0);
  $('g-quit').addEventListener('click', stopGrill);
}
/* 손가락 하나가 조각 하나를 집습니다. 전에는 잡히는 상자 안의 조각을 전부 밀어서,
   한 번 쓸 때마다 여섯 개 중 셋이 한꺼번에 살아났습니다 — 철판을 지그재그로 쓸기만
   하면 12초에 만점이었고, 조각을 들여다볼 이유가 없었습니다.
   이제는 집어서 옮겨야 하므로, 어느 조각이 타들어가는지 보고 골라야 합니다. */
/* 조각 하나를 칠합니다. 익은 정도는 색(진한 갈색으로), 곧 타는 것은 흔들림과
   테두리빛으로. 두 신호가 겹치지 않아야 아이가 "익는 중"과 "곧 탐"을 구분합니다. */
function paintMeat(p){
  if(!p.tint) return;
  const c = Math.max(0, Math.min(1, p.cooked / MEAT_DONE));
  const burnt = p.burnt ? 0.5 : 1;
  p.tint.style.filter = 'saturate(' + (1 + 0.9 * c).toFixed(2) + ') ' +
                        'brightness(' + ((1 - 0.3 * c) * burnt).toFixed(2) + ')';
  /* 타기까지 절반쯤 남았을 때부터 알립니다. 2학년이 보고 반응할 시간이 있어야 합니다 */
  const hot = p.heat > MEAT_BURN * 0.5;
  if(hot !== p.el.classList.contains('hot')) p.el.classList.toggle('hot', hot);
}
function grillDown(e){
  if(!G) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  G.down = true; G.px = x; G.py = y;
  G.held = null;
  let near = Infinity;
  G.pieces.forEach(function(p){
    const dx = Math.abs(p.x + 25 - x), dy = Math.abs(p.y + 25 - y);
    if(dx < TUNE.meatGrab && dy < TUNE.meatGrab && dx * dx + dy * dy < near){
      near = dx * dx + dy * dy;
      G.held = p;
    }
  });
  e.currentTarget.setPointerCapture(e.pointerId);
}
function grillUp(){ if(G){ G.down = false; G.held = null; } }
function grillMove(e){
  if(!G || !G.down || !G.held) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const dx = x - G.px, dy = y - G.py;
  G.px = x; G.py = y;
  const p = G.held;
  p.x = Math.max(4, Math.min(G.w - 54, p.x + dx));
  p.y = Math.max(4, Math.min(G.h - 54, p.y + dy));
  p.heat = 0;
  p.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
}
function grillTick(now){
  if(!G) return;
  if(!$('pan')) return;
  const dt = Math.min(64, now - G.last);
  G.last = now;
  for(let i = G.pieces.length - 1; i >= 0; i--){
    const p = G.pieces[i];
    p.heat += dt;
    p.cooked += dt;
    if(p.heat >= MEAT_BURN){
      p.heat = 0;
      p.burnt = true;
      if(p.burns < MEAT_BURN_MAX){ p.burns++; G.burns++; }
    }
    paintMeat(p);
    if(p.cooked >= MEAT_DONE){
      p.el.classList.remove('hot');
      p.el.classList.add('pop');
      const el = p.el;
      setTimeout(function(){ el.remove(); }, 300);
      G.pieces.splice(i, 1);
      /* 집고 있던 조각이 완성되면 손을 놓은 것으로 칩니다. 안 그러면 사라진 조각을
         계속 끌게 되고, 아이는 왜 아무것도 안 움직이는지 모릅니다. */
      if(G.held === p) G.held = null;
      G.done++;
      drawTally(MEAT_N, G.done, 0);
      $('w-step').textContent = '닭갈비 ' + G.done + ' / ' + MEAT_N;
      $('w-earned').textContent = won(grillPay());
      if(G.done >= MEAT_N){ finishGrill(); return; }
    }
  }
  G.raf = requestAnimationFrame(grillTick);
}
function grillPay(){
  return Math.max(0, Math.round((G.done * MEAT_PAY - G.burns * 20) / 10) * 10);
}
function finishGrill(){
  if(!G) return;
  cancelAnimationFrame(G.raf);
  const tip = G.burns === 0 ? 100 : 0;
  const total = grillPay() + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, G.burns === 0 ? '하나도 안 태워서 팁 100원'
                                  : ('조금 탄 것이 ' + G.burns + '번 있었어요'));
  $('w-step').textContent = '닭갈비 ' + MEAT_N + ' / ' + MEAT_N;
}
function stopGrill(){
  if(!G) return;
  cancelAnimationFrame(G.raf);
  const earned = grillPay();
  if(earned > 0){ S.money += earned; S.works--; save(); }
  endWork();
}

/* ---------- 라떼아트 (B계열 · 정밀하게) ----------
   끌어내릴수록 주전자가 기웁니다. 많이 기울이면 빨리 차지만 거품이 깨지고,
   넘기면 흘러버립니다. 점선 위에서 손을 떼야 하트가 생깁니다. */
let L = null;
const CUP_N = 3, CUP_GOAL = TUNE.cupGoal, CUP_RUIN = 0.62;
/* 잔 그림 안에서 "잔 속"이 어디인가. CSS 의 .milk/.foam/.goal 과 같은 자리를 가리킵니다.
   진짜 work/cup 그림을 재서 옮긴 값입니다: 안쪽 바닥이 cupwrap 아래에서 45px,
   테두리 앞쪽이 91px. 잔이 임시 도형보다 낮고 넓어서 차는 구간이 79px 에서 46px 로
   줄었습니다 — 차는 속도(TUNE.latteSpeed)는 level 기준이라 그대로입니다.
   level 100 이 테두리에 딱 닿게 맞춥니다.
   ★ 그림을 다시 뽑으면 이 두 숫자와 CSS 네 줄을 다시 재야 합니다. */
const CUP_BOTTOM = 45, CUP_RIM = 91;
const CUP_SCALE = (CUP_RIM - CUP_BOTTOM) / 100;
function milkH(level){ return Math.min(CUP_RIM - CUP_BOTTOM + 8, level * CUP_SCALE); }

function startLatte(){
  L = { cup:0, level:0, tilt:0, ruined:false, pouring:false, locked:false,
        startY:0, hearts:0, score:0, last:0, raf:0 };
  $('work').hidden = false;
  buildLatte();
  L.last = performance.now();
  L.raf = requestAnimationFrame(latteTick);
}

function buildLatte(){
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = '잔 1 / ' + CUP_N;
  $('w-earned').textContent = won(0);
  const body = $('w-body');
  body.innerHTML =
    '<p class="hint">천천히 끌어내려 기울이세요. 점선까지 차면 손을 떼면 됩니다.</p>' +
    '<div class="latte" id="latte">' +
      '<div class="pitchwrap" id="pitch"></div>' +
      '<div class="stream" id="stream"></div>' +
      '<div class="cupwrap" id="cupwrap">' +
        '<div class="milk" id="milk"></div>' +
        '<div class="foam" id="foam"></div>' +
        '<div class="heart" id="heart"></div>' +
        '<div class="goal" id="goal"><span>여기까지</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="tally" id="tally"></div>' +
    '<div class="row"><button class="btn wide quit" id="l-quit">그만하기</button></div>';
  $('pitch').innerHTML = art('work/pitcher', 96);
  $('cupwrap').insertAdjacentHTML('afterbegin', art('work/cup', 150));
  $('heart').innerHTML =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.1-8-10.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8 3.8C20 15.9 12 21 12 21z" fill="#C98B6B"/></svg>';
  $('goal').style.bottom = (CUP_BOTTOM + CUP_GOAL * CUP_SCALE) + 'px';
  const el = $('latte');
  el.addEventListener('pointerdown', latteDown);
  el.addEventListener('pointermove', latteMove);
  el.addEventListener('pointerup', latteUp);
  el.addEventListener('pointercancel', latteUp);
  drawTally(CUP_N, L.hearts, L.cup - L.hearts);
  drawCup();
  $('l-quit').addEventListener('click', stopLatte);
}
function latteDown(e){
  if(!L || L.locked || L.cup >= CUP_N) return;
  L.pouring = true; L.startY = e.clientY; L.tilt = 0;
  e.currentTarget.setPointerCapture(e.pointerId);
}
function latteMove(e){
  if(!L || !L.pouring) return;
  L.tilt = Math.max(0, Math.min(1, (e.clientY - L.startY) / 120));
  if(L.tilt > CUP_RUIN) L.ruined = true;
}
function latteUp(){
  if(!L || !L.pouring) return;
  L.pouring = false; L.tilt = 0;
  judgeCup();
}
function drawCup(){
  if(!L || !$('milk')) return;
  const h = milkH(L.level);
  $('milk').style.height = h + 'px';
  $('foam').style.bottom = (CUP_BOTTOM + h - 3) + 'px';
  $('foam').style.opacity = L.level > 4 ? 1 : 0;
  $('foam').classList.toggle('broken', !!L.ruined);
  $('pitch').style.transform = 'rotate(' + (L.tilt * 52) + 'deg)';
  const st = $('stream');
  st.style.opacity = L.pouring && L.tilt > 0.06 ? 1 : 0;
  st.style.left = 'calc(50% + 14px)';
  st.style.top = '92px';
  /* 주전자 주둥이(92px)에서 우유 표면까지. .latte 250 - .cupwrap 아래 여백 12 = 238 */
  st.style.height = Math.max(0, (238 - CUP_BOTTOM - h) - 92) + 'px';
}
function latteTick(now){
  if(!L) return;
  if(!$('latte')) return;
  const dt = Math.min(64, now - L.last);
  L.last = now;
  if(L.pouring && !L.locked){
    L.level += L.tilt * TUNE.latteSpeed * dt / 1000;
    if(L.level > 125){ L.level = 125; L.pouring = false; L.tilt = 0; judgeCup(); }
  }
  drawCup();
  L.raf = requestAnimationFrame(latteTick);
}
function judgeCup(){
  if(!L) return;
  let pay = 40, msg = '';
  if(L.level > 100){ msg = '넘쳤어요'; }
  else if(L.level < CUP_GOAL){ msg = '덜 찼어요'; }
  else if(L.ruined){ pay = 80; msg = '너무 세게 부어서 하트는 못 그렸어요'; }
  else { pay = 130; L.hearts++; msg = '하트 성공!'; }
  L.score += pay;
  L.cup++;
  drawTally(CUP_N, L.hearts, L.cup - L.hearts);
  $('w-earned').textContent = won(L.score);
  $('heart').style.opacity = (pay === 130) ? 1 : 0;   // 하트 성공 삯이 130원입니다
  $('heart').style.bottom = (CUP_BOTTOM + milkH(L.level) - 16) + 'px';
  L.locked = true;
  $('w-step').textContent = msg;
  if(L.cup >= CUP_N){
    setTimeout(function(){ if(L) finishLatte(); }, 1000);
    return;
  }
  setTimeout(function(){
    if(!L) return;
    L.level = 0; L.ruined = false; L.tilt = 0; L.locked = false;
    $('heart').style.opacity = 0;
    $('w-step').textContent = '잔 ' + (L.cup + 1) + ' / ' + CUP_N;
    drawCup();
  }, 1000);
}
function finishLatte(){
  if(!L) return;
  cancelAnimationFrame(L.raf);
  const tip = L.hearts === CUP_N ? 100 : 0;
  const total = L.score + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, '하트 ' + L.hearts + '개' + (tip ? ' · 세 잔 다 성공해서 팁 100원' : ''));
  $('w-step').textContent = '잔 ' + CUP_N + ' / ' + CUP_N;
}
function stopLatte(){
  if(!L) return;
  cancelAnimationFrame(L.raf);
  if(L.score > 0){ S.money += L.score; S.works--; save(); }
  endWork();
}

/* ---------- 비빔밥 (B계열 · 넓게 칠하기) ----------
   그릇을 여덟 칸 × 여덟 줄로 나누고, 손가락이 지나간 자리만 섞입니다.
   안 섞인 구역이 색으로 남아 보이므로 빠진 데를 찾아 메우게 됩니다.
   닭갈비가 한 점을 쫓는 게임이라면 이건 넓이를 메우는 게임입니다. */
let B = null;
const BOWL_N = 3, BOWL_SIDE = 8, BOWL_DONE = 85, BOWL_PAY = 130, BOWL_FAST = 36000;
const BIBIM_COLORS = ['#7FA85E', '#D9A441', '#C4553C', '#EDE3CB', '#6E7F4E', '#A8C06E'];

function startBibim(){
  B = { bowl:0, cells:[], score:0, down:false, locked:false, t0:0 };
  $('work').hidden = false;
  buildBibim();
  B.t0 = performance.now();
  newBowl();
}
function buildBibim(){
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = '그릇 1 / ' + BOWL_N;
  $('w-earned').textContent = won(0);
  $('w-body').innerHTML =
    '<p class="hint">손가락으로 둥글게 비벼 주세요. 색이 하나가 되면 완성이에요.</p>' +
    '<div class="bowl" id="bowl"><div class="cells" id="cells"></div></div>' +
    '<div class="tally" id="tally"></div>' +
    '<div class="row"><button class="btn wide quit" id="b-quit">그만하기</button></div>';
  const el = $('bowl');
  el.addEventListener('pointerdown', bibimDown);
  el.addEventListener('pointermove', bibimMove);
  el.addEventListener('pointerup', bibimUp);
  el.addEventListener('pointercancel', bibimUp);
  $('b-quit').addEventListener('click', stopBibim);
  drawTally(BOWL_N, B.bowl, 0);
}
function newBowl(){
  const box = $('cells');
  if(!box) return;
  box.innerHTML = '';
  B.cells = [];
  const n = BOWL_SIDE * BOWL_SIDE;
  for(let i = 0; i < n; i++){
    const col = i % BOWL_SIDE, row = Math.floor(i / BOWL_SIDE);
    const fx = (col + 0.5) / BOWL_SIDE, fy = (row + 0.5) / BOWL_SIDE;
    const dead = Math.sqrt((fx - 0.5) * (fx - 0.5) + (fy - 0.5) * (fy - 0.5)) > 0.47;
    const d = document.createElement('div');
    d.className = 'cell2';
    d.style.background = BIBIM_COLORS[Math.floor(Math.random() * BIBIM_COLORS.length)];
    const m = document.createElement('div');
    m.className = 'mx';
    d.appendChild(m);
    box.appendChild(d);
    B.cells.push({ mx:m, v:0, dead:dead, fx:fx, fy:fy });
  }
  B.locked = false;
  const bowl = $('bowl');
  if(bowl) bowl.classList.remove('done');
}
function bibimDown(e){
  if(!B || B.locked) return;
  B.down = true;
  e.currentTarget.setPointerCapture(e.pointerId);
  bibimMove(e);
}
function bibimUp(){ if(B) B.down = false; }
function bibimMove(e){
  if(!B || !B.down || B.locked) return;
  const r = e.currentTarget.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  let all = true;
  B.cells.forEach(function(c){
    const dx = c.fx - fx, dy = c.fy - fy;
    if(Math.sqrt(dx * dx + dy * dy) < TUNE.brush) c.v = Math.min(100, c.v + TUNE.brushInk);
    c.mx.style.opacity = c.v / 100;
    if(!c.dead && c.v < BOWL_DONE) all = false;
  });
  if(all) finishBowl();
}
function finishBowl(){
  B.locked = true;
  B.down = false;
  B.score += BOWL_PAY;
  B.bowl++;
  drawTally(BOWL_N, B.bowl, 0);
  $('w-earned').textContent = won(B.score);
  const bowl = $('bowl');
  if(bowl) bowl.classList.add('done');
  if(B.bowl >= BOWL_N){
    $('w-step').textContent = '완성!';
    setTimeout(function(){ if(B) finishBibim(); }, 800);
    return;
  }
  $('w-step').textContent = '완성! 다음 그릇';
  setTimeout(function(){
    if(!B) return;
    newBowl();
    $('w-step').textContent = '그릇 ' + (B.bowl + 1) + ' / ' + BOWL_N;
  }, 800);
}
function finishBibim(){
  if(!B) return;
  const fast = (performance.now() - B.t0) < BOWL_FAST;
  const tip = fast ? 100 : 0;
  const total = B.score + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, fast ? '손이 빨라서 팁 100원' : '세 그릇 다 비볐어요');
  $('w-step').textContent = '그릇 ' + BOWL_N + ' / ' + BOWL_N;
}
function stopBibim(){
  if(!B) return;
  if(B.score > 0){ S.money += B.score; S.works--; save(); }
  endWork();
}

/* ---------- 귤 (C계열 · 쓸어서 받기) ----------
   위쪽 나뭇잎을 손가락으로 쓸면 그 자리 귤이 떨어집니다.
   바구니는 손가락의 좌우 위치를 늘 따라다니므로, 쓸고 내려와 받는 한 손 리듬이 됩니다. */
let Y = null;
const GYUL_N = 12, GYUL_PAY = 33;

function startGyul(){
  Y = { fruit:[], caught:0, gone:0, bx:150, last:0, raf:0, w:300, h:300 };
  $('work').hidden = false;
  buildGyul();
  Y.last = performance.now();
  Y.raf = requestAnimationFrame(gyulTick);
}
function buildGyul(){
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = '귤 0 / ' + GYUL_N;
  $('w-earned').textContent = won(0);
  $('w-body').innerHTML =
    '<p class="hint">위쪽 잎을 쓸면 귤이 떨어져요. 바구니는 손가락을 따라갑니다.</p>' +
    '<div class="grove" id="grove"><div class="leaf"></div><div class="ground"></div>' +
      '<div class="basket" id="basket"></div></div>' +
    '<div class="tally" id="tally"></div>' +
    '<div class="row"><button class="btn wide quit" id="y-quit">그만하기</button></div>';
  const g = $('grove');
  Y.w = g.clientWidth || 300;
  Y.h = g.clientHeight || 300;
  Y.bx = Y.w / 2;
  for(let i = 0; i < GYUL_N; i++){
    const el = document.createElement('div');
    el.className = 'gy';
    el.innerHTML = art('work/orange', 30);
    g.appendChild(el);
    const o = {
      el: el,
      x: 16 + Math.random() * (Y.w - 62),
      y: 14 + Math.random() * (Y.h * 0.34 - 30),
      on: true, vy: 0
    };
    el.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px)';
    Y.fruit.push(o);
  }
  $('basket').innerHTML = art('work/basket', 70);
  g.addEventListener('pointerdown', gyulMove);
  g.addEventListener('pointermove', gyulMove);
  drawTally(GYUL_N, Y.caught, Y.gone);
  $('y-quit').addEventListener('click', stopGyul);
}
function gyulMove(e){
  if(!Y) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  Y.bx = Math.max(35, Math.min(Y.w - 35, x));
  if(y < Y.h * 0.44){
    Y.fruit.forEach(function(o){
      if(o.on && Math.abs(o.x + 15 - x) < TUNE.gyulGrab && Math.abs(o.y + 15 - y) < TUNE.gyulGrab){
        o.on = false;
        o.vy = 0.04;
        /* 떨어지면서 옆으로 흐릅니다. 안 그러면 흔든 자리에 바구니가 이미 있어서
           손가락을 가만히 두기만 해도 전부 들어갔습니다. */
        o.vx = (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.55) * TUNE.gyulDrift;
      }
    });
  }
}
function gyulTick(now){
  if(!Y) return;
  if(!$('grove')) return;
  const dt = Math.min(64, now - Y.last);
  Y.last = now;
  const bk = $('basket');
  if(bk) bk.style.transform = 'translateX(' + (Y.bx - 35) + 'px)';
  const floor = Y.h - 54;
  for(let i = Y.fruit.length - 1; i >= 0; i--){
    const o = Y.fruit[i];
    if(o.on) continue;
    o.vy += 0.0011 * dt;
    o.y += o.vy * dt;
    o.x += (o.vx || 0) * dt;
    if(o.x < 2 || o.x > Y.w - 32){ o.vx = -(o.vx || 0); }   // 가장자리에서 되튕깁니다
    o.x = Math.max(2, Math.min(Y.w - 32, o.x));
    o.el.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px)';
    if(o.y >= floor){
      const hit = Math.abs(o.x + 15 - Y.bx) < TUNE.gyulCatch;
      if(hit) Y.caught++; else Y.gone++;
      o.el.remove();
      Y.fruit.splice(i, 1);
      drawTally(GYUL_N, Y.caught, Y.gone);
      $('w-step').textContent = '귤 ' + Y.caught + ' / ' + GYUL_N;
      $('w-earned').textContent = won(Y.caught * GYUL_PAY);
      if(Y.caught + Y.gone >= GYUL_N){ finishGyul(); return; }
    }
  }
  Y.raf = requestAnimationFrame(gyulTick);
}
function finishGyul(){
  if(!Y) return;
  cancelAnimationFrame(Y.raf);
  const tip = Y.caught === GYUL_N ? 100 : 0;
  const total = Y.caught * GYUL_PAY + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, GYUL_N + '개 중에 ' + Y.caught + '개를 받았어요' +
    (tip ? ' · 다 받아서 팁 100원' : ''));
  $('w-step').textContent = '귤 ' + Y.caught + ' / ' + GYUL_N;
}
function stopGyul(){
  if(!Y) return;
  cancelAnimationFrame(Y.raf);
  const earned = Y.caught * GYUL_PAY;
  if(earned > 0){ S.money += earned; S.works--; save(); }
  endWork();
}

/* 결과 화면은 모든 미니게임이 이 하나를 같이 씁니다.
   전에는 일곱 군데가 같은 열여덟 줄을 따로 들고 있었습니다. */
function workResult(total, note){
  const body = $('w-body');
  body.innerHTML = '';
  const r = document.createElement('div');
  r.className = 'order result';
  r.innerHTML =
    '<div style="font-family:var(--font-display); font-size:19px">오늘 일 끝!</div>' +
    '<div class="big">' + won(total) + '</div>' +
    '<div class="hint">' + note + '</div>';
  body.appendChild(r);
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<button class="btn go wide" id="w-done">가방에 넣기</button>';
  body.appendChild(row);
  $('w-earned').textContent = won(total);
  $('w-done').addEventListener('click', endWork);
}

/* ---------- 겹화면 ----------
   겹화면이 떠 있는 동안 뒤쪽 .app 을 inert 로 꺼 둡니다. 안 그러면 미니게임 중에도
   탭 키가 뒤로 새서 '밥 주기'·'불 끄고 자기' 같은 버튼 열한 개에 닿습니다.
   hidden 이 바뀌는 자리가 여기저기라, 어느 길로 열고 닫히든 걸리게 지켜봅니다. */
const OVERLAYS = ['work', 'intro', 'sheet', 'night', 'yay', 'ride'];
function syncOverlays(){
  const open = OVERLAYS.filter(function(id){ const el = $(id); return el && !el.hidden; }).length > 0;
  const app = document.querySelector('.app');
  if(app) app.inert = open;
}
const overlayWatch = new MutationObserver(syncOverlays);
OVERLAYS.forEach(function(id){
  const el = $(id);
  if(el) overlayWatch.observe(el, { attributes:true, attributeFilter:['hidden'] });
});
syncOverlays();

/* Esc 로 닫는 것은 "보기만 하는" 겹화면뿐입니다. 일하기는 그만하기로 끝내야
   삯 계산을 거치고, 시작 화면은 이름을 정하기 전엔 나갈 데가 없습니다. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(!$('yay').hidden){ $('yay-close').click(); return; }
  if(!$('night').hidden){ $('night-close').click(); return; }
  if(!$('sheet').hidden){
    if(location.hash) location.hash = '';
    else closeSheet();
  }
});

/* ---------- 시작 ---------- */
function start(data){
  if(data && data.S) Object.assign(S, data.S);
  else load();
  normalize();
  const gap = rollover();
  render();
  go(S.tab || 'hamster');
  if(location.hash === '#art') showSheet();
  else if(location.hash === '#tune') showTune();
  else if(!S.me.name) showIntro();
  else if(gap >= 2){ go('hamster'); say('기다렸어!', null); }
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){ return { S: S }; });
}
if(window.claude && window.claude.hot && window.claude.hot.ready){
  window.claude.hot.ready(start);
}else{
  start(null);
}
</script>
