<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>햄찌랑 전국일주</title>
</head>
<body>
<title>햄찌랑 전국일주</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 아티팩트는 이 두 줄을 알아서 넣어주지만 게임-바로열기.html 은 아닙니다.
     여기 적어 두면 두 곳에서 같게 보입니다.
     [hidden] 에 !important 가 붙은 이유: 아래 .work/.night/.pad>section 의 display:flex 가
     브라우저 기본값 [hidden]{display:none} 을 이겨버립니다. */
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}

  /* Layout: one-screen app — thin status bar, scrolling play area, three bottom tabs */
  :root{
    --bg:#EDF5F2; --surface:#FFFFFF; --surface-2:#F5FAF8; --sunk:#E3EFEA;
    --ink:#2C3A35; --ink-soft:#6E8279;
    --line:#D7E6E0;
    --coral:#DD7C65; --sage:#5FA78F; --sun:#E5AE49; --sky:#7AACC8;
    --shadow:0 2px 0 rgba(44,58,53,.10);
    --fur:#E9C9A2; --fur-light:#F8E8D4; --fur-dark:#D7B087; --face:#5A463A; --blush:#F0AFA2;
    --bag-r:#DD6B6B; --bag-b:#5B8FD6; --bag-y:#E8B043;
    --font-display:'Jua', system-ui, sans-serif;
    --font-body:'Gowun Dodum', system-ui, sans-serif;
    color-scheme:light;
  }
  /* 룩은 밝은 낮 한 가지로 고정합니다. 다크 모드를 두지 않는 이유:
     AI로 뽑은 그림은 색이 박혀 있어 테마를 따라갈 수 없고,
     UI만 어두워지면 그림과 반드시 어긋나기 때문입니다. */

  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:17px; line-height:1.5;
    -webkit-tap-highlight-color:transparent;
    /* 한글은 기본값(normal)이면 어절 한가운데서 줄이 바뀝니다. 320px 에서 세어 보니
       "전/주", "비빔밥집에/서", "다시 가/는" 처럼 270 군데가 쪼개졌습니다.
       글자를 막 뗀 2학년한테는 다른 낱말로 보입니다. keep-all 은 띄어쓰기에서만
       줄을 바꿉니다 — 넣어도 320px 에서 넘치는 곳은 그대로 0 입니다. */
    word-break:keep-all;
  }
  .app{height:100%; display:flex; flex-direction:column; max-width:560px; margin:0 auto}

  /* status bar */
  .status{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding-block:10px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .coin{font-family:var(--font-display); font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums}
  .status .sep{color:var(--line)}
  .status .meta{color:var(--ink-soft); font-size:15px}
  .status .right{margin-left:auto; color:var(--ink-soft); font-size:15px}

  /* play area */
  .stage{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden}
  .pad{
    padding-block:18px 26px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    display:flex; flex-direction:column; gap:16px;
  }

  /* 한 화면 안의 덩이들도 같은 간격으로 */
  .pad > section{display:flex; flex-direction:column; gap:14px}
  h2{font-family:var(--font-display); font-size:22px; margin:0; text-wrap:balance; font-weight:400}
  .hint{color:var(--ink-soft); font-size:15px; margin:0}

  /* hamster room */
  .room{
    background:var(--surface); border:1px solid var(--line); border-radius:22px;
    padding:14px 14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .bubble{
    font-family:var(--font-display); font-size:19px;
    background:var(--sunk); color:var(--ink);
    padding:7px 16px; border-radius:16px; position:relative; min-height:34px;
  }
  .bubble::after{
    content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-top:8px solid var(--sunk);
  }
  /* 아트 슬롯 — 상자 크기는 코드가 잡고, 안에 든 그림만 갈아끼웁니다 */
  .art{display:inline-block; max-width:100%; line-height:0}
  .art > svg, .art > img{width:100%; height:100%; display:block}
  .art.bounce{animation:bounce .5s ease-in-out}
  @keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px)}}

  /* 상반신만 보이기 — 같은 그림의 위쪽을 잘라 씁니다 */
  .art.half{overflow:hidden}
  .art.half > svg, .art.half > img{width:100%; height:auto}

  /* 나 */
  .room-floor{display:flex; align-items:flex-end; justify-content:center; gap:4px; width:100%}
  .room-floor > div{min-width:0; flex:0 1 auto}
  .me{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
      border-radius:20px; padding:10px 14px; box-shadow:var(--shadow)}
  .me .who{flex:1; min-width:0}
  .me .who b{font-family:var(--font-display); font-weight:400; font-size:18px; display:block}
  .me .who span{color:var(--ink-soft); font-size:14px}
  .rider{position:absolute; left:10px; bottom:0; width:76px}

  /* 옷장 */
  .wardrobe{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .wear{background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:8px 6px;
        display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-width:0;
        font-family:var(--font-body); font-size:13px; color:var(--ink); text-align:center}
  .wear b{font-family:var(--font-display); font-weight:400; font-size:14px}
  .wear.on{border-color:var(--sage); border-width:2px; padding:7px 5px}
  .wear.off{opacity:.5; cursor:default}
  .wear .where{color:var(--ink-soft); font-size:12px}
  .wear:focus-visible{outline:3px solid var(--sun); outline-offset:2px}

  /* 내 집 */
  .room-box{position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow)}
  .room-floorband{position:absolute; left:0; right:0; bottom:0; height:42%}
  .room-grid{position:relative; display:grid; grid-template-columns:repeat(6,1fr); aspect-ratio:6 / 4}
  .cellbox{display:flex; align-items:center; justify-content:center; cursor:pointer;
           border:none; background:none; padding:2px; min-width:0}
  .cellbox.open{border-radius:9px; outline:2px dashed rgba(255,255,255,0.7); outline-offset:-4px}
  .cellbox:focus-visible{outline:3px solid var(--sun); outline-offset:-3px}
  .tray{display:flex; flex-wrap:wrap; gap:8px}
  .tray button{background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:6px 8px 4px;
               display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; min-width:66px;
               font-family:var(--font-body); font-size:12px; color:var(--ink-soft)}
  .tray button[aria-pressed="true"]{border-color:var(--sage); background:var(--sunk); color:var(--ink)}
  .tray button:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
  .swatches{display:flex; gap:8px; flex-wrap:wrap}
  .sw{width:40px; height:40px; border-radius:12px; border:2px solid var(--line); cursor:pointer; padding:0}
  .sw[aria-pressed="true"]{border-color:var(--sage); border-width:3px}
  .sw:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
  .signbox{font-family:var(--font-display); font-size:18px; text-align:center; color:var(--ink);
           background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:10px; width:100%}
  .signbox:focus{outline:none; border-color:var(--sage)}
  .lab{display:block; font-family:var(--font-display); font-size:16px; margin:0; color:var(--ink-soft)}

  /* 놀기 — 작은 버튼 한 줄 */
  .playrow{display:flex; gap:8px}
  .playrow button{
    flex:1 1 0; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:9px 4px; cursor:pointer; min-height:48px; box-shadow:var(--shadow);
    font-family:var(--font-display); font-size:14px; color:var(--ink);
  }
  .playrow button:active{transform:translateY(2px); box-shadow:none}
  .playrow button:focus-visible{outline:3px solid var(--sun); outline-offset:2px}

  /* 오늘 할 일 — 가로 한 줄 */
  .todo{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:12px 10px;
        display:flex; flex-direction:row; gap:6px}
  .todo-row{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px;
            font-size:13px; text-align:center}
  .todo-row .tname{width:100%; min-width:0}
  .todo-row.done .tname{color:var(--ink-soft)}
  /* 네 칸 다 같은 동그라미를 씁니다. 일하기만 안 끝났을 때 남은 횟수를 안에 적습니다.
     점 세 개를 따로 쓰면 안 찬 점이 오히려 "다 했다"처럼 보였습니다. */
  .check{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto;
         display:flex; align-items:center; justify-content:center;
         font-family:var(--font-display); font-size:15px; color:var(--ink-soft)}
  .todo-row.done .check{background:var(--sage); border-color:var(--sage); color:#FFFFFF}

  /* 상점 갈래 */
  .segs{display:flex; gap:6px; background:var(--sunk); border-radius:16px; padding:5px}
  .segs button{flex:1 1 0; min-width:0; border:none; background:none; border-radius:12px;
               padding:10px 4px; cursor:pointer; min-height:44px;
               font-family:var(--font-display); font-size:15px; color:var(--ink-soft)}
  .segs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  .segs button:focus-visible{outline:3px solid var(--sun); outline-offset:-2px}

  /* 밤 — 오늘은 여기까지 */
  .night{position:fixed; inset:0; z-index:14; background:#1D2A33;
         display:flex; align-items:center; justify-content:center;
         padding-left:max(16px, env(safe-area-inset-left, 0px));
         padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .night-in{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; max-width:360px; width:100%}
  .night-t{font-family:var(--font-display); font-size:23px; color:#F3EDE2; margin:0}
  .night-s{font-family:var(--font-body); font-size:16px; color:#AFC0CB; margin:0}
  .night .btn{background:#2C3D48; border-color:#3C5160; color:#F3EDE2; margin-top:10px; box-shadow:none}

  /* 시작 화면 */
  .namebox{font-family:var(--font-display); font-size:20px; text-align:center; color:var(--ink);
           background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:12px; width:100%}
  .namebox:focus{outline:none; border-color:var(--sage)}
  /* 적을 자리라는 게 보여야 합니다. 제목 글꼴로 크게 가운데 두면 이미 적힌 값처럼 보입니다 */
  .namebox::placeholder{font-family:var(--font-body); font-size:16px; color:var(--ink-soft)}
  .pickme{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .pickme button{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:12px 8px;
                 display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; min-width:0;
                 font-family:var(--font-display); font-size:15px; color:var(--ink)}
  .pickme button[aria-pressed="true"]{border-color:var(--sage); background:var(--sunk)}

  /* 아트 슬롯 목록 (주소 끝에 #art) */
  .sheet{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px}
  .cell{background:var(--surface); border:1px solid var(--line); border-radius:16px;
        padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center}
  .cell b{font-family:var(--font-display); font-weight:400; font-size:15px}
  .cell span{font-size:12px; color:var(--ink-soft)}
  .cell .no{color:var(--coral)}
  .cell code{font-size:11px; color:var(--ink-soft); word-break:break-all}
  .sheet-h{font-family:var(--font-display); font-size:19px; margin:6px 0 0}

  /* buttons */
  .row{display:flex; flex-wrap:wrap; gap:10px}
  .btn{
    font-family:var(--font-display); font-size:17px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px;
    flex:1 1 calc(50% - 5px); min-width:0;
  }
  .btn small{font-family:var(--font-body); font-size:14px; color:var(--ink-soft)}
  .btn:active{transform:translateY(2px); box-shadow:none}
  .btn[disabled]{opacity:.45; cursor:default}
  .btn[disabled]:active{transform:none; box-shadow:var(--shadow)}
  .btn.wide{flex:1 1 100%}
  .btn.go{background:var(--sage); border-color:var(--sage); color:#fff}
  .btn.go small{color:rgba(255,255,255,.85)}
  /* 잠자기 버튼. 이름을 night 로 두면 위의 밤 화면 .night(position:fixed; inset:0) 를
     그대로 뒤집어써서 버튼이 화면 전체를 덮습니다. 그래서 sleep 입니다. */
  .btn.sleep{background:var(--sky); border-color:var(--sky); color:#fff}
  .btn.sleep.big{font-size:19px; min-height:64px}
  .done-line{width:100%; text-align:center; font-family:var(--font-display); font-size:17px; color:var(--sage); margin:0}
  /* 미니게임의 그만하기. 재료·통 버튼과 같은 흰 카드라 일곱 번째 재료처럼 보였고,
     바로 아래 붙어 있어서 잘못 누르기 쉬웠습니다. 누를 일이 드문 버튼이니 조용하게 둡니다. */
  .btn.quit{background:none; border-color:transparent; box-shadow:none; color:var(--ink-soft);
            font-family:var(--font-body); font-size:15px; min-height:44px}
  .btn.quit:active{transform:none; box-shadow:none}
  .btn:focus-visible{outline:3px solid var(--sun); outline-offset:2px}

  /* street */
  /* 거리 배경 띠. 그림이 없는 도시는 .has 가 안 붙어서 지금처럼 제목 한 줄입니다 —
     여덟 장이 다 와야 쓸 수 있으면 한 장도 못 씁니다.
     전면 배경이 아니라 띠인 이유: 320px 화면에서 버튼 카드가 430px 를 덮어서,
     뒤에 깔아봐야 카드 사이 12px 틈으로만 보입니다. */
  .citybg.has{
    aspect-ratio:1024 / 560; border:1px solid var(--line); border-radius:20px; overflow:hidden;
    background-size:cover; background-position:center bottom;
    display:flex; align-items:flex-end; padding:12px;
  }
  /* 그림 위의 글자는 안 읽힙니다. 이름표를 깔아 줍니다 */
  .citybg.has h2{background:var(--surface); border-radius:14px; padding:4px 12px}
  .street{display:grid; gap:12px}
  .place{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:14px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
    font-family:var(--font-body); font-size:16px;
  }
  .place:active{transform:translateY(2px); box-shadow:none}
  .place:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
  .place .nm{font-family:var(--font-display); font-size:19px; display:block}
  .place .sub{display:block; font-family:var(--font-body); color:var(--ink-soft); font-size:14px}
  .place.locked{opacity:.5; cursor:default}
  .place.locked:active{transform:none; box-shadow:var(--shadow)}
  .place svg{flex:0 0 auto}

  /* shop + bag lists */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:12px}
  .item{display:flex; align-items:center; gap:12px}
  .item .nm{flex:1; min-width:0}
  .item .nm b{font-family:var(--font-display); font-weight:400; font-size:17px; display:block}
  .item .nm span{color:var(--ink-soft); font-size:14px}
  .buy{
    font-family:var(--font-display); font-size:16px; border:none; border-radius:14px;
    padding:10px 14px; background:var(--sun); color:#3A2E12; cursor:pointer; min-height:44px;
    white-space:nowrap;
  }
  .buy[disabled]{background:var(--sunk); color:var(--ink-soft); cursor:default}
  .buy:focus-visible{outline:3px solid var(--sage); outline-offset:2px}
  .tag{font-family:var(--font-display); font-size:13px; background:var(--coral); color:#fff; border-radius:10px; padding:3px 8px}
  .stat{display:flex; justify-content:space-between; gap:12px; font-size:16px}
  .stat b{font-family:var(--font-display); font-weight:400; font-variant-numeric:tabular-nums}

  /* tabs */
  .tabs{
    display:flex; background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    padding-left:max(0px, env(safe-area-inset-left, 0px));
    padding-right:max(0px, env(safe-area-inset-right, 0px));
  }
  .tab{
    flex:1; border:none; background:none; cursor:pointer; padding:9px 2px 11px;
    font-family:var(--font-display); font-size:13px; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:2px; min-height:60px; min-width:0;
  }
  .tab .ic{display:block; line-height:0}
  .tab .ic svg{width:23px; height:23px; display:block}
  .tab[aria-current]{color:var(--sage)}
  .tab:focus-visible{outline:3px solid var(--sun); outline-offset:-3px}
  .tab.need{color:var(--coral)}
  .tab.need .ic{animation:tabpulse 1.4s ease-in-out infinite}
  @keyframes tabpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

  /* 다음에 할 곳 반짝이기 */
  @keyframes glow{
    0%,100%{box-shadow:0 0 0 0 rgba(223,124,101,0.5)}
    50%{box-shadow:0 0 0 9px rgba(223,124,101,0)}
  }
  .pulse{animation:glow 1.7s ease-out infinite}

  /* 되돌리기 */
  .undo{display:flex; align-items:center; gap:10px; background:var(--sunk);
        border:1px solid var(--line); border-radius:16px; padding:10px 12px; font-size:15px}
  .undo span{flex:1; min-width:0}
  /* 비어 있는 칸은 자리를 차지하지 않게. 섹션이 flex라 빈 div도 간격을 하나 먹습니다 */
  #undo-bar:empty, #undo-bar-home:empty, .me:empty{display:none}

  /* 축하 */
  .night.yay{background:#2F7A63}
  .night.yay .btn{background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.35)}

  /* work overlay */
  .work{
    position:fixed; inset:0; background:var(--bg); z-index:10;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .work .inner{
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    padding-block:18px 24px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    max-width:560px; margin:0 auto; width:100%;
  }
  .counter{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:12px}
  .order{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:14px; display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .order .slots{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; min-height:66px; align-items:center}

  /* 꺼진 버튼은 꺼져 보여야 합니다. 주문을 보여주는 동안 재료 버튼이,

  .pick[disabled], .tray button[disabled]{opacity:.45; cursor:default}

  /* bus ride */
  .ride{
    position:fixed; inset:0; z-index:12; background:var(--sky); cursor:pointer;

  }

    width:min(100%,420px); aspect-ratio:3/2; max-width:100%;

  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .ride .cap{font-family:var(--font-display); font-size:21px; color:#fff; text-align:center}
  .ride .cap.small{font-family:var(--font-body); font-size:15px; opacity:.9}

  /* airport belt */
  .belt{position:relative; height:132px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
  .zone{position:absolute; top:0; bottom:0; background:var(--sunk); border-left:2px dashed var(--sage); border-right:2px dashed var(--sage)}
  .rail{position:absolute; left:0; right:0; top:104px; height:3px; background:var(--line)}
  .lug{position:absolute; top:36px; left:0; width:56px; height:56px; will-change:transform}

  .bins{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}

  .bin:active{transform:translateY(2px); box-shadow:none}

  /* 벨트에 아무것도 없을 때 눌러도 통이 한 번 흔들립니다. 조용히 넘기면
     아이한테는 "눌렀는데 안 됐다"만 남습니다. */
  .bin.bad{animation:shake .3s}
  /* B계열 — 닭갈비 철판 */
  .pan{position:relative; height:220px; border-radius:22px; overflow:hidden; touch-action:none;
       background:#4E5357; border:1px solid var(--line); cursor:grab}
  .pan .plate{position:absolute; left:10px; right:10px; top:10px; bottom:10px;
              border-radius:16px; background:#767D82}
  .meat{position:absolute; left:0; top:0; width:50px; height:50px; will-change:transform; pointer-events:none}
  /* 익는 정도는 그림 자체를 어둡게 해서 보여줍니다. 전에는 둥근 칠(42px)을 그림 위에
     덮었는데, 갈비 그림이 그보다 작아서 조각 둘레에 갈색 테가 생겼습니다 — 고기가
     익는 게 아니라 철판에 얼룩이 앉은 것처럼 보였어요. filter 는 그림 모양을 그대로
     따라가므로 진짜 PNG 가 들어와도 맞습니다. */
  .meat .art{transition:filter .18s linear}
  /* 곧 타는 조각을 '더 어둡게'로 알리면 익는 것과 구분이 안 됩니다. 둘 다 어두워지니까요.
     그래서 색이 아니라 움직임과 테두리빛으로 알립니다 — 한눈에 다릅니다. */
  .meat.hot{filter:drop-shadow(0 0 5px rgba(255,122,40,0.95))}
  .meat.hot .art{animation:sizzle .4s ease-in-out infinite}
  @keyframes sizzle{
    0%,100%{transform:translateX(0) rotate(0)}
    25%{transform:translateX(-2px) rotate(-7deg)}
    75%{transform:translateX(2px) rotate(7deg)}
  }
  /* 완성한 조각은 제자리에서 터져야 합니다. .meat 에 걸면 pop 의 transform 이
     자리를 잡고 있던 translate(x,y) 를 덮어써서, 조각이 철판 왼쪽 위로 날아갑니다.
     (200,120)에 있던 조각이 (97,56)으로 튀는 것을 재서 확인했습니다. */
  .meat.pop .art{animation:pop .3s ease-out forwards}
  @keyframes pop{to{transform:scale(1.5); opacity:0}}

  /* B계열 — 라떼아트 */
  .latte{position:relative; height:250px; border-radius:22px; overflow:hidden; touch-action:none;
         background:var(--surface-2); border:1px solid var(--line); cursor:grab}
  .pitchwrap{position:absolute; left:50%; top:8px; width:96px; margin-left:-48px;
             transform-origin:72% 78%; will-change:transform}
  .cupwrap{position:absolute; left:50%; bottom:12px; width:150px; height:150px; margin-left:-75px}
  /* 아래 네 숫자는 "잔 그림 안에서 잔 속이 어디인가" 하나를 가리킵니다.
     진짜 work/cup 그림(384×384)을 재서 150px 상자로 옮긴 값입니다. 그림에서 잔 몸통은
     가로 24~296, 테두리 앞쪽 안이 y=150, 안쪽 바닥이 y=268 이고, ×150/384 하면
     가로 15~110(오른쪽 여백 40), 바닥이 아래에서 45px, 테두리가 91px 입니다.
     손잡이는 오른쪽 298~358 이라 우유가 거기까지 가면 손잡이 위로 흘러 보입니다.
     ★ 그림을 다시 뽑으면 이 네 줄과 JS 의 두 숫자를 다시 재야 합니다. */
  /* 우유 색이 잔 색(#F4F0E8)과 거의 같으면, 잔 안에 제대로 들어가 있어도 얼마나 찼는지
     안 보입니다. 라떼답게 한 톤 진한 크림으로 둡니다. */
  .milk{position:absolute; left:20px; right:38px; bottom:45px; background:#E6D2AE; border-radius:0 0 46px 46px}
  /* 거품은 우유(#F6F1E6) 위에 얹힙니다. 전에는 #FFFDF8 이라 명도비가 1.1:1 이었고,
     깨졌을 때 흐리게(opacity .35) 하는 신호도 눈에 안 보였습니다. 그래서 거품에
     테두리를 주고, 깨지면 아예 색을 바꿉니다 — 하트를 왜 못 받았는지 보여야 합니다. */
  .foam{position:absolute; left:20px; right:38px; height:7px; background:#FFFCF4;
        border:1px solid #CDBB99; border-radius:4px}
  .foam.broken{background:#A89166; border-color:#8A7450}
  .goal{position:absolute; left:15px; right:33px; border-top:2px dashed var(--sage)}
  /* 잔이 낮아져서 "여기까지"가 잔 테두리(주황) 위에 겹칩니다. 글자색만으로는 안 읽혀서
     흰 칩을 깔았습니다 — 뒤에 무엇이 오든 읽힙니다. */
  .goal span{position:absolute; right:-2px; top:-20px; font-size:12px; color:var(--sage);
             font-family:var(--font-display); background:rgba(255,255,255,.88);
             padding:1px 5px; border-radius:8px}
  .stream{position:absolute; width:5px; background:#F9F5EC; border-radius:3px; opacity:0}
  /* 잔 몸통 가운데는 150px 상자의 62px 자리입니다 (50% = 75 가 아닙니다).
     손잡이가 오른쪽에 달려 그림 전체의 가운데는 잔 가운데보다 오른쪽입니다. */
  .heart{position:absolute; left:50%; margin-left:-26px; width:26px; height:26px; opacity:0}

  /* B계열 — 비빔밥 그릇 */
  .bowl{position:relative; width:min(100%,264px); margin:0 auto; aspect-ratio:1;
        border-radius:50%; overflow:hidden; border:10px solid #C08359; background:#E8D9BF;
        touch-action:none; cursor:grab}
  .bowl .cells{position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr)}
  .cell2{position:relative}
  .cell2 .mx{position:absolute; inset:0; background:#C4553C; opacity:0}
  .bowl.done{animation:pop .4s ease-out}

  /* C계열 — 귤밭 */
  .grove{position:relative; height:300px; border-radius:22px; overflow:hidden; touch-action:none;
         background:#DCEBF2; border:1px solid var(--line); cursor:grab}
  .grove .leaf{position:absolute; left:0; right:0; top:0; height:40%; background:#7FB58C;
               border-radius:0 0 40px 40px}
  .grove .ground{position:absolute; left:0; right:0; bottom:0; height:16%; background:#B9CF9E}
  .gy{position:absolute; left:0; top:0; width:30px; height:30px; will-change:transform; pointer-events:none}
  .basket{position:absolute; left:0; bottom:8px; width:70px; will-change:transform; pointer-events:none}

  .tally{display:flex; gap:6px; flex-wrap:wrap}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--sunk)}
  .dot.hit{background:var(--sage)}
  .dot.miss{background:var(--line)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>

'use strict';

/* ---------- 말 ---------- */
const T = {

  { id:'wheel',  name:'쳇바퀴',    desc:'한 번만 사면 돼요', price:500, once:true },
  { id:'tunnel', name:'터널',      desc:'한 번만 사면 돼요', price:400, once:true }
];

/* ---------- 편의점 재료 ---------- */
const ITEMS = [
  { id:'gimbap', name:'삼각김밥' },
  { id:'milk',   name:'우유' },
  { id:'ramen',  name:'컵라면' },
  { id:'choco',  name:'초코바' },
  { id:'drink',  name:'음료수' },
  { id:'banana', name:'바나나' }
];
const BAKERY = [
  { id:'flour',  name:'밀가루' },
  { id:'butter', name:'버터' },
  { id:'sugar',  name:'설탕' },
  { id:'egg',    name:'달걀' },
  { id:'cream',  name:'생크림' },

/* A계열 변형. 편의점은 보여주고 바로 치는 리듬, 빵집은 외우고 기다렸다 치는 리듬입니다.
   빵집은 주문이 길고 보여주는 시간이 길이와 상관없이 짧아서 외우는 쪽에 무게가 실립니다. */
const WORK_A = {
  store: {
    items: ITEMS,
    len:   function(i){ return 2 + i; },

const CITIES = {

const ROUTES = [
  { a:'incheon',   b:'seoul',     fare:400 },
  { a:'seoul',     b:'chuncheon', fare:700 },
  { a:'chuncheon', b:'gangneung', fare:900 },
  { a:'gangneung', b:'gyeongju',  fare:1200 },

function routeBoat(from, to){
  const r = ROUTES.filter(function(x){
    return (x.a === from && x.b === to) || (x.b === from && x.a === to);
  })[0];
  return !!(r && r.boat);
}
function fareTo(from, to){
  const r = ROUTES.filter(function(x){
    return (x.a === from && x.b === to) || (x.b === from && x.a === to);
  })[0];
  return r ? r.fare : 0;
}
function cityOrder(){ return Object.keys(CITIES); }

/* 처음 가는 길은 제값, 이미 도장을 받은 도시로 다시 가는 길은 반값입니다.
   탐험은 큰맘 먹고, 오가는 것은 가볍게. 옷이 도시마다 흩어져 있어서
   왕복이 비싸면 모으러 다닐 수가 없습니다. */
function beenTo(key){
  return CITIES[key] && S.stamps.indexOf(CITIES[key].name) >= 0;
}
function fareNow(from, to){
  const base = fareTo(from, to);
  if(base <= 0) return 0;
  /* 지도에 "반값"이라고 적어 두었으니 반값을 넘으면 안 됩니다. 전에는 200 으로 나눠
     반올림해서 700원 길이 400원(57%)이 됐습니다. 100원 단위로 내림합니다. */
  return beenTo(to) ? Math.floor(base / 2 / 100) * 100 : base;
}

/* 저장 모양이 바뀌어도 열리게 맞춰 놓습니다. 집은 CITIES를 보고 채우므로
   나중에 도시를 늘려도 옛 저장이 깨지지 않습니다.
   S.v 는 적어만 두고 아직 아무 데서도 읽지 않습니다 — 나중에 저장 모양을 크게
   바꿔야 할 때 "어느 판으로 저장된 것인가"를 알기 위한 자리입니다. */
const SAVE_V = 2;
function normalize(){
  if(!S.me || !S.me.owned || !S.me.owned.length) S.me = { name:'', sex:'b', look:'1', owned:['1'] };
  /* 성별이 생기기 전 저장은 남자로 엽니다. 가방에서 언제든 바꿉니다 */
  if(S.me.sex !== 'b' && S.me.sex !== 'g') S.me.sex = 'b';
  if(!S.today) S.today = { fed:false, shopped:false, played:false };
  if(!S.inv) S.inv = { food:1, water:1, bed:1, treat:0 };
  if(!S.owns) S.owns = { wheel:false, tunnel:false };
  if(!S.furn) S.furn = {};
  if(!S.stamps || !S.stamps.length) S.stamps = ['서울'];
  if(!S.homes || typeof S.homes !== 'object') S.homes = {};
  Object.keys(CITIES).forEach(function(k){
    const h = S.homes[k];
    if(!h || typeof h !== 'object'){
      S.homes[k] = { owned: k === 'seoul', wall:0, floor:0, sign:'', cells:{} };
      return;
    }
    if(typeof h.wall !== 'number') h.wall = 0;
    if(typeof h.floor !== 'number') h.floor = 0;
    if(typeof h.sign !== 'string') h.sign = '';
    if(!h.cells || typeof h.cells !== 'object') h.cells = {};
  });
  if(!CITIES[S.city]) S.city = 'seoul';
  if(typeof S.works !== 'number') S.works = 3;
  if(typeof S.lastSleep !== 'number') S.lastSleep = null;
  if(typeof S.dayStamp !== 'number') S.dayStamp = null;
  if(typeof S.day !== 'number' || S.day < 1) S.day = 1;
  if(!GOODS.filter(function(g){ return g.id === S.sale; }).length) S.sale = GOODS[0].id;
  if(typeof S.hunger !== 'number') S.hunger = 60;
  if(typeof S.thirst !== 'number') S.thirst = 60;
  if(typeof S.bed !== 'number') S.bed = 70;
  if(typeof S.mood !== 'number') S.mood = 60;
  S.v = SAVE_V;
}

function art(id, px, half){
  const slot = ART[id];
  if(!slot) return blankArt();
  const w = px || slot.box || 48;
  const src = ART_SRC[id];
  const inner = src ? '<img src="' + src + '" alt="">' : placeholderFor(id);
  const ratio = half ? (slot.w + ' / ' + slot.w) : (slot.w + ' / ' + slot.h);
  return '<span class="art' + (half ? ' half' : '') +
    '" style="width:' + w + 'px; aspect-ratio:' + ratio + '">' + inner + '</span>';
}

/* 임시 그림. 진짜 그림이 다 들어오면 이 아래 함수들은 통째로 지웁니다. */
function placeholderFor(id){
  const cut = id.indexOf('/');
  const group = id.slice(0, cut), key = id.slice(cut + 1);
  if(group === 'hamster') return hamsterSVG(key);
  if(group === 'item')    return itemSVG(key);
  if(group === 'place')   return placeSVG(key);
  if(group === 'goods')   return goodsSVG(key);
  if(group === 'luggage') return lugSVG(lugColor(key));
  if(group === 'fish')    return fishSVG(key);
  if(group === 'work')    return workSVG(key);
  if(group === 'scenery') return sceneryHTML(key);
  if(group === 'stamp')   return stampSVG(key);
  if(group === 'look')    return charSVG(key);
  if(group === 'furniture') return furnSVG(key);
  return blankArt();
}
function lugColor(key){
  const c = COLORS.filter(function(x){ return x.id === key; })[0];
  return c ? c.css : 'var(--line)';
}
function sceneryKind(to){
  if(to === 'incheon' || to === 'gangneung' || to === 'busan' || to === 'jeju') return 'sea';
  if(to === 'chuncheon') return 'lake';
  if(to === 'gyeongju' || to === 'jeonju') return 'field';
  return 'city';
}
function sceneryArt(to){
  const kind = sceneryKind(to);
  const src = ART_SRC['scenery/' + kind];
  return src ? '<img src="' + src + '" alt="">' : sceneryHTML(kind);
}

/* ---------- 도움 ---------- */
const $ = function(id){ return document.getElementById(id); };
/* 아이가 적은 글(이름·문패)이 innerHTML 로 들어가는 자리가 두 군데 있습니다.
   꺾쇠를 그대로 두면 '<b>민지' 한 번에 카드가 깨지고, 태그가 진짜로 살아납니다.
   혼자 하는 게임이라 노릴 사람은 없지만 2학년이 '<3' 적으면 뒷글자가 사라집니다. */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function won(n){ return n.toLocaleString('ko-KR') + '원'; }
/* 받침이 있으면 '이', 없으면 '가'. 서류에 쓰는 "쳇바퀴이(가)" 를 2학년이 소리 내 읽습니다 */
function iga(s){
  const t = String(s);
  const c = t.charCodeAt(t.length - 1);
  if(!(c >= 0xAC00 && c <= 0xD7A3)) return '가';
  return ((c - 0xAC00) % 28) ? '이' : '가';
}
function clamp(n){ return Math.max(0, Math.min(100, n)); }
function say(text, kind, hold){
  $('say').textContent = text;
  if(kind){
    face = kind;
    clearTimeout(faceTimer);
    faceTimer = setTimeout(function(){ face = 'idle'; drawHamster(); }, hold || 1600);
  }
  drawHamster();
}

/* ---------- 그리기 ---------- */
function moodWord(){
  if(face === 'sleep') return T.sleeping;
  if(S.hunger < 30) return T.hungry;
  if(S.thirst < 30) return T.thirsty;
  if(S.bed < 30) return T.dirty;
  if(S.mood > 80) return T.happy;
  return T.ok;
}
function moodFace(){
  if(face !== 'idle') return face;
  if(S.hunger < 30 || S.thirst < 30 || S.bed < 30) return 'sad';
  if(S.mood > 80) return 'glad';
  return 'idle';
}
function drawHamster(){
  const k = moodFace();
  $('ham').innerHTML = art('hamster/' + k, 200);
  if(k === 'glad' || k === 'eat'){
    const el = $('ham').firstChild;
    if(el && el.classList) el.classList.add('bounce');
  }
}

function drawStatus(){
  $('money').textContent = won(S.money);
  $('day').textContent = S.day + '일째';
  $('works').textContent = S.works > 0 ? ('일할 수 있는 횟수 ' + S.works + '번') : '오늘 일은 끝';
}

function careButton(label, note, on, hot){
  const b = document.createElement('button');
  b.className = 'btn' + (hot ? ' pulse' : '');
  b.innerHTML = '<span>' + label + '</span>' + (note ? '<small>' + note + '</small>' : '');
  b.addEventListener('click', on);
  return b;
}
function playButton(label, on, hot){
  const b = document.createElement('button');
  b.type = 'button';
  if(hot) b.className = 'pulse';
  b.textContent = label;
  b.addEventListener('click', on);
  return b;
}
function drawCare(){
  const box = $('care');
  const play = $('play');
  const task = nextTask();
  box.innerHTML = '';
  play.innerHTML = '';
  box.appendChild(careButton('밥 주기', S.inv.food + '개', function(){
    if(S.inv.food <= 0){ say(T.noFood, null); return; }
    S.inv.food--; S.hunger = 100; S.mood = clamp(S.mood + 8); S.today.fed = true;
    say(T.eating, 'eat'); after();
  }, task === 'fed'));
  box.appendChild(careButton('물 주기', S.inv.water + '개', function(){
    if(S.inv.water <= 0){ say(T.noWater, null); return; }
    S.inv.water--; S.thirst = 100; S.mood = clamp(S.mood + 4);
    say('꿀꺽꿀꺽', 'eat'); after();
  }));
  box.appendChild(careButton('톱밥 갈기', S.inv.bed + '개', function(){
    if(S.inv.bed <= 0){ say(T.noBed, null); return; }
    S.inv.bed--; S.bed = 100; S.mood = clamp(S.mood + 6);
    say('폭신폭신해졌다', 'glad'); after();
  }));
  play.appendChild(playButton('쓰담', function(){
    S.mood = clamp(S.mood + 12); S.today.played = true;
    say(T.pet, 'glad'); after();
  }, task === 'played'));
  play.appendChild(playButton('간식 ' + S.inv.treat, function(){
    if(S.inv.treat <= 0){ say(T.noTreat, null); return; }
    S.inv.treat--; S.mood = clamp(S.mood + 20); S.hunger = clamp(S.hunger + 10); S.today.played = true;
    say('볼주머니에 쏙!', 'eat'); after();
  }));
  if(S.owns.wheel){
    play.appendChild(playButton('쳇바퀴', function(){
      S.mood = clamp(S.mood + 15); S.today.played = true;
      say('다다다다다!', 'glad'); after();
    }));
  }
  if(S.owns.tunnel){
    play.appendChild(playButton('터널', function(){
      S.mood = clamp(S.mood + 15); S.today.played = true;
      say('쏙 들어갔다 쏙!', 'glad'); after();
    }));
  }
}

function drawPlaces(){
  const box = $('places');
  box.innerHTML = '';
  $('street-name').textContent = CITIES[S.city].name;
  /* 그림이 온 도시만 띠가 뜹니다. 한 장씩 들어와도 그 도시부터 바로 바뀝니다 */
  const bgEl = $('city-bg');
  const bgSrc = ART_SRC['bg/street-' + S.city];
  bgEl.classList.toggle('has', !!bgSrc);
  bgEl.style.backgroundImage = bgSrc ? 'url("' + bgSrc + '")' : '';
  function place(kind, nm, sub, on, locked, hot){
    const b = document.createElement('button');
    b.className = 'place' + (locked ? ' locked' : '') + (hot && !locked ? ' pulse' : '');
    b.innerHTML = art('place/' + kind, 46) + '<span class="nm">' + nm + '<span class="sub">' + sub + '</span></span>';
    if(!locked) b.addEventListener('click', on);
    else b.disabled = true;
    box.appendChild(b);
  }
  const task = nextTask();
  const canWork = canAct() && S.works > 0;
  const workSub = !canAct()
    ? '오늘은 다 했어요. 내일 또 할 수 있어요'
    : (S.works > 0
        ? ('일하기 · 오늘 ' + S.works + '번 남음')
        : '오늘 세 번 다 했어요. 내일 또 할 수 있어요');
  const wp = WORKPLACE[S.city];
  if(wp){
    place(wp.kind, wp.name, workSub, function(){ if(canWork) wp.start(); }, !canWork, task === 'work');
  }
  place('shop', '상점', '햄찌 물건 사기', function(){ go('shop'); }, false, task === 'shopped');
  place('home', '내 집', homeSub(), function(){ go('home'); }, false);

  const sg = SIGHT[S.city];
  if(sg){
    place(sg.kind, sg.name, sg.sub, function(){
      S.mood = clamp(S.mood + 10);
      save();
      go('hamster');
      say(sg.say, 'glad', 2200);
    }, false);
  }

  const near = cityOrder().filter(function(k){ return fareTo(S.city, k) > 0; });
  const busSub = near.map(function(k){ return CITIES[k].name + ' ' + won(fareNow(S.city, k)); }).join(' · ');
  const boat = near.filter(function(k){ return routeBoat(S.city, k); }).length > 0;
  const stop = (S.city === 'jeju') ? '항구' : (boat ? '버스정류장과 항구' : '버스정류장');
  place(S.city === 'jeju' ? 'port' : 'bus', stop, busSub, function(){ go('map'); }, false);
}

function drawMap(){
  const box = $('map');
  box.innerHTML = '';
  $('map-hint').textContent = '바로 옆 도시로만 갈 수 있어요. 가 본 도시로 다시 가는 길은 반값입니다.';
  const keys = cityOrder();
  let prevMain = null, num = 0;
  keys.forEach(function(key){
    const c = CITIES[key];
    const parent = c.branch || prevMain;
    if(parent){
      const ln = document.createElement('div');
      ln.className = 'link' + (c.branch ? ' branch' : '');
      ln.innerHTML = '<span class="bar"></span><span class="linkfare">' +
        won(fareTo(parent, key)) + (routeBoat(parent, key) ? ' · 배나 비행기' : '') + '</span>';
      box.appendChild(ln);
    }
    num++;
    const here = S.city === key;
    const fare = fareNow(S.city, key);
    const n = document.createElement('div');
    n.className = 'node' + (here ? ' here' : '') + (c.branch ? ' branch' : '');
    n.innerHTML = '<span class="pin' + (here ? ' on' : '') + '">' + num + '</span>' +
      '<span class="nm">' + c.name + '<span class="sub">' + c.sub + '</span></span>';
    if(here){
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = '지금 여기';
      n.appendChild(t);
    }else if(fare > 0){
      const b = document.createElement('button');
      b.className = 'buy';
      const how = routeBoat(S.city, key) ? '배 ' : '버스 ';
      b.textContent = S.money >= fare ? (how + won(fare)) : '돈이 모자라요';
      b.disabled = S.money < fare;
      b.addEventListener('click', function(){ travel(key); });
      n.appendChild(b);
    }else{
      const t = document.createElement('span');
      t.className = 'far';
      t.textContent = '옆 도시를 거쳐야 해요';
      n.appendChild(t);
    }
    box.appendChild(n);
    if(!c.branch) prevMain = key;
  });
  const note = document.createElement('p');
  note.className = 'hint';
  note.textContent = '전주는 경주에서 갈라지는 가지예요. 제주는 배나 비행기로만 갑니다.';
  box.appendChild(note);
}

function travel(to){
  const fare = fareNow(S.city, to);
  if(fare <= 0 || S.money < fare || S.city === to) return;
  S.money -= fare;
  const ride = $('ride');
  $('scenery').innerHTML = sceneryArt(to);
  $('rider').innerHTML = art(meLook(), 76, true);
  $('ride-cap').textContent = CITIES[to].to + ' 가는 중';
  ride.hidden = false;
  let done = false;
  function arrive(){
    if(done) return;
    done = true;
    clearTimeout(timer);
    ride.removeEventListener('click', arrive);
    ride.hidden = true;
    S.city = to;
    const nm = CITIES[to].name;
    let first = false;
    if(S.stamps.indexOf(nm) < 0){ S.stamps.push(nm); first = true; }
    save();
    render();
    go('street');
    if(first){
      go('hamster');
      say(nm + ' 도장 받았다!', 'glad', 2400);
    }
  }
  const timer = setTimeout(arrive, 3200);
  ride.addEventListener('click', arrive);
}

function drawShop(){
  const box = $('shop');
  box.innerHTML = '';
  const saleName = (GOODS.filter(function(g){ return g.id === S.sale; })[0] || {}).name || '';
  $('sale-hint').textContent = saleName ? ('오늘은 ' + saleName + iga(saleName) + ' 30% 싸요.') : '';
  GOODS.forEach(function(g){
    const owned = g.once && S.owns[g.id];
    const price = g.id === S.sale ? Math.round(g.price * 0.7 / 10) * 10 : g.price;
    const row = document.createElement('div');
    row.className = 'item';
    const pic = document.createElement('div');
    pic.innerHTML = art('goods/' + g.id, 34);
    const nm = document.createElement('div');
    nm.className = 'nm';
    /* 깎인 값만 보여주면 깎였다는 걸 알 수 없습니다. 원래 값을 옆에 적어 둡니다 */
    const sale = g.id === S.sale && !owned;
    nm.innerHTML = '<b>' + g.name + (sale ? ' <span class="tag">할인</span>' : '') + '</b><span>' +
      g.desc + (sale ? ' · 원래 ' + won(g.price) : '') + '</span>';

/* ---------- 하루 한 번 ----------
   잠자기는 기기 날짜가 바뀌어야 다시 할 수 있습니다.
   "몇 시간 뒤에 오세요" 같은 재촉은 두지 않습니다. 돌보기와 꾸미기는 언제든 열려 있고,
   돈이 걸린 일하기와 잠자기만 하루에 한 번으로 묶습니다. */
/* 그 지역 기준의 날짜 번호. 뺄셈으로 며칠이 지났는지 셀 수 있습니다. */
function dayNum(){
  const d = new Date();
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}
function canAct(){ return S.lastSleep !== dayNum(); }

/* 하루치 상태는 현실 날짜가 바뀌면 되돌아옵니다.
   충전을 잠자기가 아니라 날짜가 맡으므로, 자지 않고 그냥 꺼도 다음 날을 잃지 않습니다.

   햄찌가 배고파지는 것도 여기서 합니다. 하루가 지나면 밥과 물은 배고픈 표정이 뜰 만큼
   줄고, 톱밥은 이틀에 한 번 갈 만큼만 줄어듭니다. 아무리 오래 비워도 사흘치까지만 세고
   바닥값이 있어서, 한 달 만에 와도 이틀 만에 온 것과 같습니다. 밥 한 번이면 바로 회복해요.
   절대 죽지 않는다는 규칙을 숫자로 옮긴 것입니다. */
const GAP_MAX = 3;
function rollover(){
  const n = dayNum();
  if(S.dayStamp === n) return 0;
  const had = (typeof S.dayStamp === 'number');
  const gap = had ? Math.max(0, Math.min(GAP_MAX, n - S.dayStamp)) : 0;
  /* "며칠째"는 들어온 날을 셉니다. 전에는 잠자기만 올려서, 자는 버튼을 안 누르는
     아이는 한 달을 놀아도 1일째였습니다. 며칠을 건너뛰어도 한 칸만 올립니다 —
     월요일에 놀고 금요일에 와서 "5일째"라고 하면 빠뜨린 날처럼 보입니다. */
  if(had) S.day++;
  S.dayStamp = n;
  S.works = 3;
  S.today = { fed:false, shopped:false, played:false };
  /* 이미 가진 '한 번만 사는' 물건은 빼고 고릅니다. 걸리면 "오늘은 쳇바퀴가 30% 싸요"
     옆에서 버튼이 "가지고 있음"이라, 살 수 없는 걸 할인한다고 알리게 됩니다. */
  const onSale = GOODS.filter(function(g){ return !(g.once && S.owns[g.id]); });
  const pool = onSale.length ? onSale : GOODS;
  S.sale = pool[Math.floor(Math.random() * pool.length)].id;
  for(let i = 0; i < gap; i++){
    S.hunger = Math.max(10, S.hunger - 75);
    S.thirst = Math.max(10, S.thirst - 75);
    S.bed    = Math.max(10, S.bed - 45);
    S.mood   = Math.max(20, S.mood - 20);
  }
  return gap;
}

const TODO = [
  { id:'fed',     name:'밥 주기' },
  { id:'work',    name:'일하기' },
  { id:'shopped', name:'상점 가기' },
  { id:'played',  name:'놀기' }
];
function todoDone(id){
  if(id === 'work') return S.works <= 0;
  return !!S.today[id];
}
function allDone(){
  return TODO.filter(function(t){ return !todoDone(t.id); }).length === 0;
}
let sleepArmed = false;
function drawTodo(){
  const box = $('todo');
  box.innerHTML = '';
  TODO.forEach(function(t){
    const row = document.createElement('div');
    const done = todoDone(t.id);
    row.className = 'todo-row' + (done ? ' done' : '');
    const inside = done ? '✓' : (t.id === 'work' ? S.works : '');
    row.innerHTML = '<span class="check">' + inside + '</span>' +
                    '<span class="tname">' + t.name + '</span>';
    box.appendChild(row);
  });

  const wrap = $('sleep-wrap');
  wrap.innerHTML = '';
  if(!canAct()){
    const p = document.createElement('p');
    p.className = 'hint done-line';
    p.textContent = '오늘은 다 했어요. 내일 또 만나요.';
    wrap.appendChild(p);
    const p2 = document.createElement('p');
    p2.className = 'hint';
    p2.style.width = '100%';
    p2.style.textAlign = 'center';
    p2.textContent = '집 꾸미기와 햄찌랑 놀기는 더 할 수 있어요.';
    wrap.appendChild(p2);
    return;
  }
  /* 자는 순간 현실 날짜가 바뀔 때까지 일하기가 잠깁니다. 켜자마자 눌러서 하루를
     통째로 잃는 일이 없도록, 할 일이 남았으면 한 번 더 누르게 합니다.
     확인창(confirm) 대신 버튼 자체를 바꾸는 쪽을 골랐습니다. */
  const left = TODO.filter(function(t){ return !todoDone(t.id); }).map(function(t){ return t.name; });
  const b = document.createElement('button');
  b.className = 'btn sleep wide' + (allDone() ? ' big' : '') + (nextTask() === 'sleep' ? ' pulse' : '');
  b.textContent = allDone() ? '다 했어요! 불 끄고 자기'
                : (sleepArmed ? '정말 잘까요? 한 번 더 누르기' : '불 끄고 자기');
  b.addEventListener('click', function(){
    if(!allDone() && !sleepArmed){ sleepArmed = true; drawTodo(); return; }
    goSleep();
  });
  wrap.appendChild(b);
  if(sleepArmed && !allDone()){
    const warn = document.createElement('p');
    warn.className = 'hint';
    warn.style.width = '100%';
    warn.style.textAlign = 'center';
    warn.textContent = '아직 ' + left.join(', ') + ' 남았어요. 자고 나면 내일까지 못 해요.';
    wrap.appendChild(warn);
  }
}

    S.lastSleep = dayNum();
    face = 'idle';
    save();
    render();
    showNight();

/* ---------- 다음에 할 곳 ----------
   기획서의 "반짝이는 곳을 탭하면 진행된다"를 지금 구조에 맞춘 것입니다.
   정해진 순서를 강요하지 않고, 오늘 할 일 중 아직 안 끝난 첫 번째 자리만 반짝입니다. */
function nextTask(){
  if(!canAct()) return null;
  if(!S.today.fed) return 'fed';
  if(S.works > 0) return 'work';
  if(!S.today.shopped) return 'shopped';
  if(!S.today.played) return 'played';
  return 'sleep';
}
function taskTab(t){
  if(t === 'work' || t === 'shopped') return 'street';
  if(t === 'fed' || t === 'played' || t === 'sleep') return 'hamster';
  return null;
}

const TAB_LABEL = { map:'지도', street:'거리', home:'집', hamster:'햄찌', bag:'가방' };
/* 상점은 아래 메뉴에 칸이 없습니다. 거리에서 들어가는 곳이니 거리를 "지금 여기"로 둡니다.
   전에는 상점에 있는 동안 다섯 칸이 전부 꺼지고, 대신 햄찌가 빨갛게 깜빡여서
   아이가 어디에 있는지도, 어디로 가야 하는지도 알 수 없었습니다. */
function tabFor(name){ return name === 'shop' ? 'street' : name; }
function tabIcon(k){
  const s = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">';
  const e = '</svg>';
  if(k === 'map')     return s + '<path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 12 7 12s7-6.8 7-12a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.6" fill="var(--surface)"/>' + e;
  if(k === 'street')  return s + '<rect x="2.5" y="9" width="7" height="12" rx="1.5"/><rect x="11.5" y="3.5" width="9" height="17.5" rx="1.5"/><rect x="14" y="6.5" width="2" height="2" fill="var(--surface)"/><rect x="17" y="6.5" width="2" height="2" fill="var(--surface)"/>' + e;
  if(k === 'home')    return s + '<path d="M12 3l9.5 8.4-1.3 1.5-1.2-1V21H7V11.9l-1.2 1L2.5 11.4z"/><rect x="10.3" y="15" width="3.4" height="6" rx="1" fill="var(--surface)"/>' + e;
  if(k === 'hamster') return s + '<circle cx="6.8" cy="7.5" r="3.2"/><circle cx="17.2" cy="7.5" r="3.2"/><circle cx="12" cy="14" r="8"/><circle cx="9.3" cy="13" r="1.4" fill="var(--surface)"/><circle cx="14.7" cy="13" r="1.4" fill="var(--surface)"/>' + e;
  return s + '<path d="M4.5 7.5h15L20.5 21h-17z"/><path d="M9 7.5V6a3 3 0 0 1 6 0v1.5" fill="none" stroke="currentColor" stroke-width="2"/>' + e;
}
function drawTabs(){
  const need = taskTab(nextTask());
  const here = tabFor(S.tab);
  document.querySelectorAll('.tab').forEach(function(t){
    const k = t.dataset.go;
    t.innerHTML = '<span class="ic">' + tabIcon(k) + '</span><span>' + TAB_LABEL[k] + '</span>';

    else t.classList.remove('need');
  });
}

/* ---------- 되돌리기 ----------
   확인창을 쓰지 않는 대신 방금 산 것을 물릴 수 있게 합니다. */
let lastBuy = null;
function noteBuy(kind, id, price){ lastBuy = { kind:kind, id:id, price:price }; }
function buyName(b){
  if(b.kind === 'goods') return (GOODS.filter(function(g){ return g.id === b.id; })[0] || {}).name || '';
  if(b.kind === 'look')  return (lookById(b.id) || {}).name || '';
  if(b.kind === 'home')  return ((CITIES[b.id] || {}).name || '') + ' 집';
  return (FURN.filter(function(f){ return f.id === b.id; })[0] || {}).name || '';
}
/* 집은 가구를 놓는 순간 물릴 수 없습니다. 놓인 가구가 갈 데가 없어지기 때문입니다. */
function homeUndoable(cityKey){
  const h = S.homes[cityKey];
  return !!h && h.owned && Object.keys(h.cells || {}).length === 0;
}
function undoBuy(){
  if(!lastBuy) return;
  const b = lastBuy;
  if(b.kind === 'goods'){
    const g = GOODS.filter(function(x){ return x.id === b.id; })[0];
    if(!g) return;
    if(g.once) S.owns[g.id] = false;
    else S.inv[g.id] = Math.max(0, (S.inv[g.id] || 0) - g.add);
  }else if(b.kind === 'look'){
    S.me.owned = S.me.owned.filter(function(x){ return x !== b.id; });
    if(S.me.look === b.id) S.me.look = S.me.owned[0] || '1';
  }else if(b.kind === 'home'){
    if(!homeUndoable(b.id)) return;
    S.homes[b.id].owned = false;
  }else{
    if(freeCount(b.id) <= 0) return;
    S.furn[b.id] = Math.max(0, (S.furn[b.id] || 0) - 1);
  }
  S.money += b.price;
  lastBuy = null;
  save();
  render();
}
/* 상점과 내 집 두 곳에 자리가 있습니다. 집은 집 화면에서 사니까요. */
function drawUndo(){
  const boxes = [$('undo-bar'), $('undo-bar-home')];
  boxes.forEach(function(x){ if(x) x.innerHTML = ''; });
  if(!lastBuy) return;
  if(lastBuy.kind === 'furn' && freeCount(lastBuy.id) <= 0){ lastBuy = null; return; }
  if(lastBuy.kind === 'home' && !homeUndoable(lastBuy.id)){ lastBuy = null; return; }
  boxes.forEach(function(box){
    if(!box) return;
    const bar = document.createElement('div');
    bar.className = 'undo';
    const t = document.createElement('span');
    t.textContent = '방금 산 것 · ' + buyName(lastBuy);
    bar.appendChild(t);
    const b = document.createElement('button');
    b.className = 'buy';
    b.textContent = '되돌리기';
    b.addEventListener('click', undoBuy);
    bar.appendChild(b);
    box.appendChild(bar);
  });
}

function drawShopLooks(){
  const box = $('shop-looks');
  box.innerHTML = '';
  const list = LOOKS.filter(function(L){
    return L.city === S.city && S.me.owned.indexOf(L.id) < 0;
  });
  if(!list.length){
    box.innerHTML = '<p class="hint">여기 옷은 다 샀어요. 다른 도시에 가면 또 있어요.</p>';
    return;
  }
  list.forEach(function(L){
    const row = document.createElement('div');
    row.className = 'item';
    const pic = document.createElement('div');
    pic.innerHTML = art(lookId(L.id), 38);
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.innerHTML = '<b>' + L.name + '</b><span>' + CITIES[S.city].name + '에서만 팔아요</span>';
    const btn = document.createElement('button');
    btn.className = 'buy';
    btn.textContent = won(L.price);
    btn.disabled = S.money < L.price;
    btn.addEventListener('click', function(){
      if(S.money < L.price || S.me.owned.indexOf(L.id) >= 0) return;
      S.money -= L.price;

      b.disabled = n <= 0;
      b.innerHTML = art('furniture/' + f.id, 36) + '<span>' + f.name + ' ' + n + '</span>';

/* ---------- 화면 전환 ---------- */
function go(name){
  S.tab = name;
  ['map','hamster','street','home','bag','shop'].forEach(function(n){
    $('s-' + n).hidden = (n !== name);
  });
  document.querySelectorAll('.tab').forEach(function(t){
    if(t.dataset.go === tabFor(name)) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  if(sleepArmed){ sleepArmed = false; drawTodo(); }   // 다른 화면에 다녀오면 확인이 풀립니다
  /* "상점"은 사야 체크되는 게 아니라 들르면 체크됩니다.
     사야 끝나는 구조면 돈이 없는 날엔 영영 안 끝나고, 집 살 돈을 모으는 날에도
     뭔가 사라고 떠밀게 됩니다. */
  if(name === 'shop' && !S.today.shopped){ S.today.shopped = true; drawTodo(); }
  if(name === 'hamster'){ $('say').textContent = moodWord(); drawHamster(); }
  if(name !== 'shop' && name !== 'home'){ lastBuy = null; drawUndo(); }
  /* 거리도 같이 다시 그립니다. 안 그리면 상점에 들렀다 아무것도 안 사고 나왔을 때
     shopped 는 켜졌는데 거리의 상점 타일은 계속 반짝여서, 아래 메뉴와 거리가
     서로 다른 곳을 가리킵니다. 타일 대여섯 개라 매번 그려도 쌉니다. */
  drawPlaces();
  drawTabs();
  document.querySelector('.stage').scrollTop = 0;
  save();
}

/* ---------- 편의점 미니게임 ---------- */
/* 손님은 AI 그림이 아니라 코드입니다. 화면에 56px 폭으로 뜨는 그림이라
   남는 것이 머리 모양과 옷 색 둘뿐이고, 표정이 바뀌어야 쓸모가 있는데
   PNG 넷에 표정을 덮으면 맞출 좌표가 넷으로 늘어납니다. 룩 그림을 머리색만
   갈아 다시 씁니다 — 넷이 머리와 상의 색으로 갈립니다. */
const CUSTOMERS = [
  { look:'b/14', hair:'#9C9A95' },   // 흰머리·붉은 상의
  { look:'g/17', hair:'#3E2C22' },   // 긴머리·노란 옷
  { look:'b/4',  hair:'#2E2A26' },   // 짧은머리·남색
  { look:'b/3',  hair:'#4A3426' }    // 짧은머리·민트
];
function custArt(n, mood){
  const c = CUSTOMERS[n % CUSTOMERS.length];
  /* 4/5 는 상반신만 보이는 비율입니다. 다 보이게 하면 112px 이라 일하는 화면이 스크롤됩니다. */
  return '<span class="art half" style="width:56px; aspect-ratio:4 / 5">' +
    charSVG(c.look, c.hair, mood) + '</span>';
}
function custMood(){
  // 주문을 다 채우고 다음 손님을 기다리는 구간. order 가 비어 있을 때 참이 되면 안 됩니다
  if(W.order.length && W.step >= W.order.length) return 'glad';
  return W.sad ? 'sad' : 'idle';
}
let W = null;
function startWork(kind){
  /* mistakes 는 이 손님 것, missTotal 은 일하는 내내입니다.
     삯은 손님마다 따로 매기고, 팁은 세 손님을 다 무사히 넘겼을 때만 줍니다. */
  W = { v: WORK_A[kind] || WORK_A.store,
        idx:0, order:[], step:0, mistakes:0, missTotal:0, earned:0, showing:true,
        sad:false, cust:Math.floor(Math.random() * CUSTOMERS.length) };
  $('work').hidden = false;
  nextCustomer();
}
function endWork(){
  $('work').hidden = true;
  W = null;
  if(A){ cancelAnimationFrame(A.raf); A = null; }
  if(G){ cancelAnimationFrame(G.raf); G = null; }
  if(L){ cancelAnimationFrame(L.raf); L = null; }
  if(B){ B = null; }
  if(Y){ cancelAnimationFrame(Y.raf); Y = null; }
  render();
  go('street');
}
function nextCustomer(){
  if(W.idx >= 3){ finishWork(); return; }
  const len = W.v.len(W.idx);
  const pool = W.v.items;
  W.order = [];
  for(let i = 0; i < len; i++){
    W.order.push(pool[Math.floor(Math.random() * pool.length)].id);
  }
  W.step = 0;
  W.mistakes = 0;   // 안 되돌리면 손님 1 에서 한 번 틀린 값이 손님 2·3 삯까지 깎습니다
  W.sad = false;
  W.showing = true;
  drawWork();
  setTimeout(function(){
    if(!W) return;
    W.showing = false;
    drawWork();
  }, W.v.showMs(len));
}
function drawWork(){
  if(!W) return;
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = '손님 ' + Math.min(W.idx + 1, 3) + ' / 3';
  $('w-earned').textContent = won(W.earned);
  const body = $('w-body');
  body.innerHTML = '';

  const order = document.createElement('div');
  order.className = 'order';
  const title = document.createElement('div');
  title.style.fontFamily = 'var(--font-display)';
  title.style.fontSize = '19px';
  title.textContent = W.showing ? W.v.ask : W.v.wait;
  const head = document.createElement('div');
  head.className = 'cust';
  head.innerHTML = custArt(W.cust + W.idx, custMood());
  head.appendChild(title);
  const slots = document.createElement('div');
  slots.className = 'slots';
  W.order.forEach(function(id, i){
    const sl = document.createElement('div');
    if(W.showing){
      sl.className = 'slot';
      sl.innerHTML = art('item/' + id, 44);
    }else if(i < W.step){
      sl.className = 'slot done';
      sl.innerHTML = art('item/' + id, 44);
    }else{
      sl.className = 'slot q';
      sl.textContent = '?';
    }
    slots.appendChild(sl);
  });
  order.appendChild(head);
  order.appendChild(slots);
  body.appendChild(order);

  const grid = document.createElement('div');
  grid.className = 'grid';
  W.v.items.forEach(function(it){
    const b = document.createElement('button');
    b.className = 'pick';
    b.innerHTML = art('item/' + it.id, 44) + '<span>' + it.name + '</span>';
    b.disabled = W.showing;
    b.addEventListener('click', function(){ pick(it.id, b); });
    grid.appendChild(b);
  });
  body.appendChild(grid);

  const quit = document.createElement('div');
  quit.className = 'row';
  quit.innerHTML = '<button class="btn wide quit" id="w-quit">그만하기</button>';
  body.appendChild(quit);
  /* 그만하기는 번 돈이 있을 때만 일 횟수를 씁니다 (미니게임 여섯 곳 다 같습니다).
     한 푼도 못 벌고 나오면 그냥 다시 들어올 수 있다는 뜻이고, 일부러 그렇게 둡니다 —
     주문이 어려워 보여 겁먹고 나온 2학년한테서 하루 세 번 중 하나를 뺏지 않으려는 것입니다. */
  $('w-quit').addEventListener('click', function(){
    if(W.earned > 0){ S.money += W.earned; S.works--; save(); }
    endWork();
  });
}
function pick(id, btn){
  /* W.step >= 길이 는 주문을 다 채우고 다음 손님을 기다리는 gap 구간입니다.
     그때 W.order[W.step] 이 undefined 라, 막아두지 않으면 뭘 눌러도 오답으로 셉니다. */
  if(!W || W.showing || W.step >= W.order.length) return;
  if(id === W.order[W.step]){
    W.step++;
    if(W.step >= W.order.length){
      const pay = Math.max(50, Math.round((40 + 33 * W.order.length - 25 * W.mistakes) / 10) * 10);
      W.earned += pay;
      drawWork();
      /* idx 는 gap 뒤에 올립니다. 먼저 올리면 "손님 2 / 3" 과 웃는 얼굴이 같이 떠서,
         아직 주문도 안 한 다음 손님이 웃고 있는 것처럼 보입니다. */
      setTimeout(function(){ if(!W) return; W.idx++; nextCustomer(); }, W.v.gap);
      return;
    }
    drawWork();
  }else{
    W.mistakes++;
    W.missTotal++;
    W.sad = true;
    btn.classList.add('shake');
    W.showing = true;                 // 흔드는 동안 더 못 누르게
    const len = W.order.length;
    setTimeout(function(){ if(W) drawWork(); }, 350);   // 흔들림이 끝난 뒤에 다시 그립니다
    setTimeout(function(){
      if(!W) return;
      W.sad = false;
      W.showing = false;
      drawWork();
    }, 1000 + len * 500);
  }
}
function finishWork(){
  const tip = W.missTotal === 0 ? 100 : 0;
  const total = W.earned + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, tip ? '한 번도 안 틀려서 팁 100원' : '틀려도 괜찮아요');
}

/* ---------- 공항 미니게임 (C계열) ---------- */
function lugSVG(color){
  return '<svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true">' +
    '<rect x="21" y="5" width="14" height="11" rx="4" fill="none" stroke="' + color + '" stroke-width="4"/>' +
    '<rect x="5" y="16" width="46" height="34" rx="9" fill="' + color + '"/>' +
    '<rect x="5" y="28" width="46" height="6" fill="rgba(255,255,255,0.5)"/>' +
    '<circle cx="16" cy="42" r="3" fill="rgba(255,255,255,0.65)"/>' +
    '<circle cx="40" cy="42" r="3" fill="rgba(255,255,255,0.65)"/>' +
    '</svg>';
}

let A = null;
const AIR_TOTAL = 12;
const AIR_PAY = 33;

function startAirport(kind){
  A = { v: WORK_C[kind] || WORK_C.bag,
        bags:[], spawned:0, done:0, hit:0, nextAt:0, last:0, raf:0, w:300, lock:0 };
  $('work').hidden = false;
  buildAirport();
  A.last = performance.now();
  A.nextAt = A.last + 500;
  A.raf = requestAnimationFrame(airTick);
}

function buildAirport(){
  $('w-me').innerHTML = art(meLook(), 40, true);
  $('w-step').textContent = A.v.label + ' 0 / ' + AIR_TOTAL;
  $('w-earned').textContent = won(0);
  const body = $('w-body');
  body.innerHTML =
    '<p class="hint">' + A.v.hint + '</p>' +
    '<div class="belt" id="belt"><div class="zone" id="zone"></div><div class="rail"></div></div>' +
    '<div class="tally" id="tally"></div>' +
    '<div class="bins" id="bins"></div>' +
    '<div class="row"><button class="btn wide quit" id="a-quit">그만하기</button></div>';
  const belt = $('belt');
  A.w = belt.clientWidth || 300;
  const z = $('zone');
  z.style.left = Math.round(A.w * 0.56) + 'px';
  z.style.width = Math.round(A.w * 0.30) + 'px';
  const bins = $('bins');
  A.v.kinds.forEach(function(c){
    const b = document.createElement('button');
    b.className = 'bin';
    b.style.background = c.css;
    if(c.ink) b.style.color = c.ink;
    b.textContent = c.name;
    b.addEventListener('click', function(){ sortBag(c.id, b); });
    bins.appendChild(b);
  });
  airTally();
  $('a-quit').addEventListener('click', stopAirport);
}

/* 점 줄은 미니게임 다섯이 같은 모양을 씁니다. 전에는 거의 같은 함수가 다섯 벌이었어요.
   앞에서부터 hit 개는 찬 점, 이어서 miss 개는 흐린 점, 나머지는 빈 점입니다. */
function drawTally(total, hit, miss){
  const t = $('tally');
  if(!t) return;
  let h = '';
  for(let i = 0; i < total; i++){
    const cls = i < hit ? 'dot hit' : (i < hit + (miss || 0) ? 'dot miss' : 'dot');
    h += '<span class="' + cls + '"></span>';
  }
  t.innerHTML = h;
}
function airTally(){ if(A) drawTally(AIR_TOTAL, A.hit, A.done - A.hit); }

function airCount(){
  $('w-step').textContent = A.v.label + ' ' + A.done + ' / ' + AIR_TOTAL;
  $('w-earned').textContent = won(A.hit * AIR_PAY);
}

function spawnBag(){
  const list = A.v.kinds;
  const c = list[Math.floor(Math.random() * list.length)];
  const el = document.createElement('div');
  el.className = 'lug';
  el.innerHTML = art(A.v.art + c.id, 56);
  el.style.transform = 'translateX(-60px)';
  const belt = $('belt');
  if(!belt) return;
  belt.appendChild(el);
  A.bags.push({ el:el, x:-60, c:c.id, k:1, t:0 });
  A.spawned++;
}

function airTick(now){
  if(!A) return;
  if(!$('belt')) return;
  const dt = Math.min(64, now - A.last);
  A.last = now;
  const base = (0.18 + 0.011 * A.spawned) * A.w / 1000;
  if(A.spawned < AIR_TOTAL && now >= A.nextAt){
    spawnBag();
    A.nextAt = now + 1900;
  }
  for(let i = A.bags.length - 1; i >= 0; i--){
    const b = A.bags[i];
    if(A.v.dart){
      b.t -= dt;
      if(b.t <= 0){
        b.k = 1 + (Math.random() - 0.5) * A.v.dart;
        b.t = 450 + Math.random() * 500;
      }
    }
    b.x += base * b.k * dt;
    b.el.style.transform = 'translateX(' + b.x + 'px)';
    if(b.x > A.w + 12){
      b.el.remove();
      A.bags.splice(i, 1);
      A.done++;
      airTally();
      airCount();
      if(A.done >= AIR_TOTAL){ finishAirport(); return; }
    }
  }
  A.raf = requestAnimationFrame(airTick);
}

function shakeBin(btn){
  if(!btn) return;
  btn.classList.remove('bad');
  void btn.offsetWidth;
  btn.classList.add('bad');
}
function sortBag(colorId, btn){
  if(!A) return;
  /* 틀려도 벌점이 없으면 세 통을 번갈아 두드리는 것만으로 다 맞습니다.
     돈을 깎는 대신 잠깐 못 누르게 해서, 색을 보고 고르게 만듭니다. */
  if(A.lock && performance.now() < A.lock) return;
  const lo = A.w * 0.56, hi = A.w * 0.86;
  let best = -1, bestX = -1;
  for(let i = 0; i < A.bags.length; i++){
    const b = A.bags[i];
    /* 눈에 보이는 대로 셉니다 — 가방 몸통이 점선 상자에 조금이라도 걸치면 됩니다.
       중심(b.x + 28) 기준으로 하면, 가방이 상자 안에 들어와 보이는데도 눌리지 않는
       구간이 벨트 앞쪽에서 0.4초쯤 생깁니다. 그동안은 신호도 없습니다.
       뒤에 온 가방보다 앞선 가방부터 처리합니다(먼저 빠져나가니까). */
    if(b.x + 56 > lo && b.x < hi && b.x > bestX){ best = i; bestX = b.x; }
  }
  if(best < 0){ shakeBin(btn); return; }   // 헛스윙도 신호는 줍니다. 잠그지는 않습니다
  const b = A.bags[best];
  if(b.c === colorId){
    A.bags.splice(best, 1);
    b.el.remove();
    A.hit++;
    A.done++;
    airTally();
    airCount();
    if(A.done >= AIR_TOTAL) finishAirport();
  }else{
    b.el.classList.remove('bad');
    void b.el.offsetWidth;
    b.el.classList.add('bad');
    A.lock = performance.now() + TUNE.airLock;
  }
}

function finishAirport(){
  if(!A) return;
  cancelAnimationFrame(A.raf);
  const tip = A.hit === AIR_TOTAL ? 100 : 0;
  const total = A.hit * AIR_PAY + tip;
  S.money += total;
  S.works--;
  save();
  workResult(total, AIR_TOTAL + '개 중에 ' + A.hit + '개를 제자리에 넣었어요' +
    (tip ? ' · 전부 맞춰서 팁 100원' : ''));
  $('w-step').textContent = A.v.label + ' ' + AIR_TOTAL + ' / ' + AIR_TOTAL;
}

function stopAirport(){
  if(!A) return;
  cancelAnimationFrame(A.raf);
  const earned = A.hit * AIR_PAY;
  if(earned > 0){ S.money += earned; S.works--; save(); }
  endWork();
}

    '<div class="row"><button class="btn wide" id="tn-def">기본값으로</button>' +

    });

    reopenGame();

  $('tn-def').addEventListener('click', function(){

/* #tune 을 떼고 새로 읽습니다. 안 떼면 새로 읽을 때 이 화면이 또 열려서,
   고치자마자 아이에게 넘겨주지 못합니다. */
function reopenGame(){ location.replace(location.href.split('#')[0]); }

window.addEventListener('hashchange', function(){
